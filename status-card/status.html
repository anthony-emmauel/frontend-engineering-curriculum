<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Status Board</title>
    <link rel="stylesheet" href="status.css" />
  </head>
  <body>
    <div class="card" id="statusCard">
      <h2 id="statusTitle">System Status</h2>
      <p id="statusMessage">Select a status below</p>
    </div>

    <div class="buttons">
      <button id="btnOperational">Operational</button>
      <button id="btnDegraded">Degraded</button>
      <button id="btnDown">Down</button>
    </div>

    <script src="status.js"></script>
  </body>
</html>
