<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>State Arrays</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      input {
        padding: 8px;
        margin-right: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 8px 16px;
        cursor: pointer;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 8px;
        width: 300px;
      }
      .delete {
        background: red;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <h2>Item List</h2>
    <input type="text" id="itemInput" placeholder="Add item..." />
    <button id="addBtn">Add</button>
    <div id="itemList"></div>

    <script src="week5-session2-state-arrays.js"></script>
  </body>
</html>
