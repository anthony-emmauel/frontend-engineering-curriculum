<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Counter</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
        text-align: center;
      }
      h1 {
        font-size: 64px;
        margin: 20px 0;
      }
      button {
        padding: 12px 24px;
        margin: 8px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Counter</h2>
    <h1 id="count">0</h1>
    <button id="increment">+ Increment</button>
    <button id="decrement">- Decrement</button>
    <script src="warmup.js"></script>
  </body>
</html>
